name: cooldown
version: 0.1.0
manifest_version: 2
api_version: 1
description: >-
  Checks every package Hermes is about to install with pip, uv, poetry, pipx, npm, pnpm, yarn,
  bun or npx. Blocks versions OSV lists as malicious, and asks you first when a release is
  younger than 3 days (Hermes's own rule for its dependencies), the package is brand new, or
  the name is not on the registry.
author: Savage27z
license: MIT
homepage: https://github.com/Savage27z/hermes-cooldown
requires_hermes: ">=0.23.0"
tags: [security, supply-chain, npm, pypi]
provides_tools: []
provides_hooks:
  - pre_tool_call
config_schema:
  min_age_days:
    type: float
    default: 3
    description: Ask before installing a release younger than this many days.
  new_package_days:
    type: float
    default: 30
    description: Ask before installing a package that first appeared fewer than this many days ago.
  on_lookup_failure:
    type: str
    default: ask
    description: What to do when a registry cannot be reached in time, "ask" or "allow".
  allow:
    type: list
    default: []
    description: Package names that are never checked, such as your own internal packages.
